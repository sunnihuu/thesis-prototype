<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indices Prototype Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
                                <div id="map" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;"></div>
                                <div id="static-legend" style="position:absolute;bottom:30px;left:30px;background:#fff;border-radius:8px;box-shadow:0 2px 8px #0001;padding:16px 20px;z-index:10;font-family:Switzer,sans-serif;min-width:220px;">
                                    <div style="font-weight:700;font-size:1.08em;margin-bottom:10px;">Supply Gap (lbs)</div>
                                    <div style="display:flex;align-items:center;margin-bottom:6px;">
                                        <span style="width:22px;height:18px;display:inline-block;background:#2563eb;border:1px solid #222;margin-right:10px;"></span>
                                        <span style="font-size:0.98em;">Surplus &lt; -100,000</span>
                                    </div>
                                    <div style="display:flex;align-items:center;margin-bottom:6px;">
                                        <span style="width:22px;height:18px;display:inline-block;background:#e0e7ef;border:1px solid #222;margin-right:10px;"></span>
                                        <span style="font-size:0.98em;">Neutral (0)</span>
                                    </div>
                                    <div style="display:flex;align-items:center;margin-bottom:6px;">
                                        <span style="width:22px;height:18px;display:inline-block;background:#fee2e2;border:1px solid #222;margin-right:10px;"></span>
                                        <span style="font-size:0.98em;">Gap &gt; 10,000</span>
                                    </div>
                                    <div style="display:flex;align-items:center;margin-bottom:6px;">
                                        <span style="width:22px;height:18px;display:inline-block;background:#fca5a5;border:1px solid #222;margin-right:10px;"></span>
                                        <span style="font-size:0.98em;">Gap &gt; 50,000</span>
                                    </div>
                                    <div style="display:flex;align-items:center;margin-bottom:6px;">
                                        <span style="width:22px;height:18px;display:inline-block;background:#ef4444;border:1px solid #222;margin-right:10px;"></span>
                                        <span style="font-size:0.98em;">Gap &gt; 150,000</span>
                                    </div>
                                    <div style="display:flex;align-items:center;">
                                        <span style="width:22px;height:18px;display:inline-block;background:#b91c1c;border:1px solid #222;margin-right:10px;"></span>
                                        <span style="font-size:0.98em;">Gap &gt; 300,000</span>
                                    </div>
                                </div>
                <!-- Storytelling Overlay Sections -->
                <div id="section1" style="position:absolute;top:8vh;left:0;width:100vw;text-align:center;pointer-events:none;z-index:1200;">
                    <div style="display:inline-block;background:rgba(255,255,255,0.85);padding:32px 48px 28px 48px;font-family:'Switzer',sans-serif;font-size:2.2em;font-weight:700;color:#222;letter-spacing:-0.01em;border-radius:18px;box-shadow:0 2px 16px rgba(0,0,0,0.04);">Food moves quietly.</div>
                </div>
                <div id="section2" style="position:absolute;top:18vh;left:0;width:100vw;text-align:center;pointer-events:none;z-index:1200;opacity:0;transition:opacity 1.2s;">
                    <div style="display:inline-block;background:rgba(255,255,255,0.85);padding:24px 40px 20px 40px;font-family:'Switzer',sans-serif;font-size:1.6em;font-weight:500;color:#b91c1c;letter-spacing:-0.01em;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.03);">But not evenly.</div>
                </div>
                <div id="section3" style="position:absolute;top:28vh;right:4vw;min-width:220px;max-width:340px;background:rgba(255,255,255,0.92);padding:28px 36px 28px 28px;font-family:'Switzer',sans-serif;font-size:1.15em;color:#222;box-shadow:0 2px 8px rgba(0,0,0,0.04);border-radius:14px;z-index:1200;display:none;">
                    <div id="info-panel-content"></div>
                </div>
        <!-- Floating Layer Control Panel -->
        <div id="layer-control" style="position: absolute; top: 20px; left: 20px; z-index: 1100; background: rgba(255,255,255,0.95); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 12px 16px; font-family: 'Switzer', sans-serif; min-width: 180px;">
            <div style="font-weight: 700; font-size: 1.08em; margin-bottom: 8px;">Map Layers</div>
            <label style="display: block; margin-bottom: 6px;"><input type="checkbox" class="layer-toggle" data-layer="nyc-truck-routes" checked> Truck Routes</label>
            <label style="display: block; margin-bottom: 6px;"><input type="checkbox" class="layer-toggle" data-layer="stormwater-flood" checked> Flood Zones</label>
            <label style="display: block; margin-bottom: 6px;"><input type="checkbox" class="layer-toggle" data-layer="wholesale-markets" checked> Wholesale Markets</label>
            <label style="display: block; margin-bottom: 6px;"><input type="checkbox" class="layer-toggle" data-layer="census-tracts-fill" checked> Census Tracts</label>
            <label style="display: block; margin-bottom: 6px;"><input type="checkbox" class="layer-toggle" data-layer="storage-tracts-fill"> Storage Tracts</label>
            <label style="display: block; margin-bottom: 0;"><input type="checkbox" class="layer-toggle" data-layer="nyc-fresh-zoining"> Fresh Zoning</label>
        </div>
        <!-- MARKET DETAIL POP-UP (floating over map with interactive backdrop) -->
        <div id="market-detail-backdrop" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.2); z-index: 999; pointer-events: none;"></div>
        <div id="market-detail-panel" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 20px; background: #faf8f3; border-radius: 8px; border: 1px solid #e5e7eb; box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 1000; pointer-events: auto; font-family: 'Switzer', sans-serif;">
            <button id="market-detail-close" style="position: absolute; top: 12px; right: 12px; background: #faf8f3; border: 1px solid #16a34a; border-radius: 999px; font-size: 1.4em; cursor: pointer; color: #16a34a; padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">&times;</button>
            <div id="market-detail-content" style="margin-top: 8px;">
                <!-- Dynamically populated -->
            </div>
        </div>
        <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
        <script src="script.js"></script>
